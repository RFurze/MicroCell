# Conda environment ehl-fenics: FEniCS 2019.1.0 from conda-forge.
#
#   conda env create -f environment.yml
name: ehl-fenics
channels:
  - conda-forge
dependencies:
  - python=3.11
  - fenics=2019.1.0
  - fenics-dolfin=2019.1.0
  - numpy
  - scipy
  - h5py
  - matplotlib
  - pip
  - pip:
      - pytest
      - pytest-timeout
